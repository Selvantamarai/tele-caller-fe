<div class="container my-5">
    <h3 class="mb-5 text-center">
        Telicaller Status
    </h3>
    <ul class="">
        @for (item of teleCallers; track $index) {
        <li class="border rounded mb-2 px-5 py-4 list-unstyled row">
            <h6 class="col-4 mb-0 d-flex align-items-center">{{item.userName}}</h6>
            <div class="col-4">
                <button class="btn text-white" [ngClass]="getStatusClass(item.userStatus)">
                    {{ getUserStatusName(item.userStatus) }}
                </button>
            </div>
            @if (item.userStatus == 4) {
            <div class="col-4 d-flex align-items-center justify-content-center">
                <img src="assets/icons/next.svg" alt="" width="15px" class="cursor-pointer"
                    (click)="loginAsTeleCaller($index)">
            </div>
            }
        </li>
        }
    </ul>
</div>
